    <path d="M355 207V107h10v100zm3-91c-25 0-40-12-43-31 21 0 39 11 43 31z"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#173e2e" text-anchor="middle">
