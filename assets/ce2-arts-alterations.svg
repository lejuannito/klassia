<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 207" role="img" aria-labelledby="title desc">
  <title id="title">Trois signes devant le Fa</title>
  <desc id="desc">Les signes dièse, bémol et bécarre précèdent des Fa écrits au même endroit sur la portée.</desc>
  <rect width="620" height="207" rx="16" fill="#f3f8fd"/>
  <g font-family="system-ui, sans-serif" fill="#193247">
    <text x="24" y="35" font-size="24" font-weight="700">Trois signes devant le Fa</text>
    <g stroke="#7091a6" stroke-width="1.5"><path d="M90 82H586"/><path d="M90 92H586"/><path d="M90 102H586"/><path d="M90 112H586"/><path d="M90 122H586"/><path d="M586 82v40"/></g>
    <path transform="translate(101 82)" d="M19 52c11 0 8-19 4-35-4-15-9-25-3-34 5 8 6 15 1 23-5 8-17 13-17 24 0 9 9 15 17 10 8-5 8-15 2-18-8-4-14 4-10 9" fill="none" stroke="#193247" stroke-width="2.7" stroke-linecap="round"/>
    <text x="147" y="98" text-anchor="middle" font-size="21" font-weight="700">3</text>
    <text x="147" y="120" text-anchor="middle" font-size="21" font-weight="700">4</text>
    <text x="209" y="124" font-size="25" text-anchor="middle">♯</text>
    <ellipse cx="232" cy="117" rx="7.6" ry="5.2" transform="rotate(-17 232 117)" fill="#165d80"/>
    <path d="M239 116v-27" fill="none" stroke="#165d80" stroke-width="2.5"/>
    <text x="232" y="151" text-anchor="middle" font-size="18" font-weight="600">Fa dièse</text>
    <text x="354" y="124" font-size="25" text-anchor="middle">♭</text>
    <ellipse cx="377" cy="117" rx="7.6" ry="5.2" transform="rotate(-17 377 117)" fill="#165d80"/>
    <path d="M384 116v-27" fill="none" stroke="#165d80" stroke-width="2.5"/>
    <text x="377" y="151" text-anchor="middle" font-size="18" font-weight="600">Fa bémol</text>
    <text x="501" y="124" font-size="25" text-anchor="middle">♮</text>
    <ellipse cx="524" cy="117" rx="7.6" ry="5.2" transform="rotate(-17 524 117)" fill="#165d80"/>
    <path d="M531 116v-27" fill="none" stroke="#165d80" stroke-width="2.5"/>
    <text x="524" y="151" text-anchor="middle" font-size="18" font-weight="600">Fa bécarre</text>
    <text x="24" y="185" font-size="17">Même place du Fa sur la portée, signe différent devant la note.</text>
  </g>
</svg>
