<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc"><title id="title">Décomposition de 1 684</title><desc id="desc">Un millier, six centaines, huit dizaines et quatre unités.</desc><rect width="640" height="260" rx="20" fill="#f1f5ff"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="320" y="38" font-size="25" fill="#172c6a">1 684 = 1 000 + 600 + 80 + 4</text><g fill="#3157d5"><rect x="20" y="65" width="145" height="150" rx="12"/><rect x="173" y="65" width="145" height="150" rx="12"/><rect x="326" y="65" width="145" height="150" rx="12"/><rect x="479" y="65" width="141" height="150" rx="12"/></g><g fill="white" font-size="18"><text x="92" y="98">Milliers</text><text x="245" y="98">Centaines</text><text x="398" y="98">Dizaines</text><text x="549" y="98">Unités</text></g><g fill="white" font-size="58" font-weight="bold"><text x="92" y="169">1</text><text x="245" y="169">6</text><text x="398" y="169">8</text><text x="549" y="169">4</text></g><text x="320" y="243" font-size="17" fill="#172c6a">Chaque chiffre a une valeur selon sa position.</text></g></svg>
