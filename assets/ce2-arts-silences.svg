<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 206" role="img" aria-labelledby="title desc">
  <title id="title">Le troisième temps en silence</title>
  <desc id="desc">En 4/4, Sol, La, un soupir, puis Sol. Le soupir occupe le troisième temps.</desc>
  <rect width="620" height="206" rx="16" fill="#f3f8fd"/>
  <g font-family="system-ui, sans-serif" fill="#193247">
    <text x="24" y="35" font-size="24" font-weight="700">Le troisième temps en silence</text>
    <g stroke="#7091a6" stroke-width="1.5"><path d="M90 83H586"/><path d="M90 93H586"/><path d="M90 103H586"/><path d="M90 113H586"/><path d="M90 123H586"/><path d="M586 83v40"/></g>
    <path transform="translate(101 83)" d="M19 52c11 0 8-19 4-35-4-15-9-25-3-34 5 8 6 15 1 23-5 8-17 13-17 24 0 9 9 15 17 10 8-5 8-15 2-18-8-4-14 4-10 9" fill="none" stroke="#193247" stroke-width="2.7" stroke-linecap="round"/>
    <text x="147" y="99" text-anchor="middle" font-size="21" font-weight="700">4</text>
    <text x="147" y="121" text-anchor="middle" font-size="21" font-weight="700">4</text>
    <ellipse cx="216" cy="113" rx="7.6" ry="5.2" transform="rotate(-17 216 113)" fill="#165d80"/>
    <path d="M223 112v-27" fill="none" stroke="#165d80" stroke-width="2.5"/>
    <text x="216" y="154" text-anchor="middle" font-size="18" font-weight="600">Sol</text>
    <ellipse cx="320" cy="108" rx="7.6" ry="5.2" transform="rotate(-17 320 108)" fill="#165d80"/>
    <path d="M327 107v-27" fill="none" stroke="#165d80" stroke-width="2.5"/>
    <text x="320" y="154" text-anchor="middle" font-size="18" font-weight="600">La</text>
    <path d="M416 89l9 10-6 8 8 9c-10-3-11 6-5 11" fill="none" stroke="#165d80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="421" y="154" text-anchor="middle" font-size="18" font-weight="600">Soupir</text>
    <ellipse cx="536" cy="113" rx="7.6" ry="5.2" transform="rotate(-17 536 113)" fill="#165d80"/>
    <path d="M543 112v-27" fill="none" stroke="#165d80" stroke-width="2.5"/>
    <text x="536" y="154" text-anchor="middle" font-size="18" font-weight="600">Sol</text>
    <text x="24" y="185" font-size="17">Le troisième temps continue sans son.</text>
  </g>
