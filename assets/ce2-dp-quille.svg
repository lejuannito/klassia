<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" role="img" aria-labelledby="title desc">
  <title id="title">Une quille en carton</title>
  <desc id="desc">Le gabarit de 8 cm sur 14 cm comprend une face de 10 cm et un pied de 4 cm. Après le pli, le pied repose à plat.</desc>
  <rect x="2" y="2" width="616" height="336" rx="20" fill="#f9f7f1" stroke="#d9d2c4" stroke-width="2"/>
  <path d="M310 62v232" stroke="#d9d2c4" stroke-width="2"/>
  <g font-family="sans-serif" fill="#263746">
    <text x="28" y="41" font-size="25" font-weight="bold">Une quille en carton</text>
    <text x="28" y="76" font-size="19" font-weight="bold">Carton à plat</text>
    <text x="335" y="76" font-size="19" font-weight="bold">Après le pli, de profil</text>
    <text x="159" y="113" font-size="17" text-anchor="middle">8 cm</text>
    <text x="80" y="218" font-size="17" text-anchor="end">14 cm</text>
    <text x="223" y="188" font-size="17">Face</text>
    <text x="223" y="207" font-size="17">10 cm</text>
    <text x="223" y="274" font-size="17">Pied</text>
    <text x="223" y="293" font-size="17">4 cm</text>
    <text x="413" y="166" font-size="18">Face</text>
    <text x="424" y="270" font-size="18">Pied</text>
    <text x="511" y="297" font-size="16">Table</text>
  </g>
  <rect x="107" y="124" width="104" height="130" fill="#cce8e5"/>
  <rect x="107" y="254" width="104" height="52" fill="#f4d6a8"/>
  <rect x="107" y="124" width="104" height="182" fill="none" stroke="#315e64" stroke-width="2"/>
  <path d="M107 254h104" stroke="#315e64" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M98 124h-8v182h8" fill="none" stroke="#667a7c" stroke-width="2"/>
  <path d="M397 152v130" fill="none" stroke="#315e64" stroke-width="8" stroke-linecap="round"/>
  <path d="M397 282h52" fill="none" stroke="#9b5726" stroke-width="8" stroke-linecap="round"/>
  <path d="M346 288h158" fill="none" stroke="#667a7c" stroke-width="2"/>
