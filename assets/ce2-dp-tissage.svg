<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">Deux rangées de tissage</title>
  <desc id="desc">La rangée 1 passe dessus aux montants 1 et 3. La rangée 2 passe dessus aux montants 2 et 4.</desc>
  <rect x="2" y="2" width="596" height="276" rx="20" fill="#f9f7f1" stroke="#d9d2c4" stroke-width="2"/>
  <g font-family="sans-serif" fill="#263746">
    <text x="28" y="40" font-size="25" font-weight="bold">Deux rangées de tissage</text>
    <text x="160" y="74" font-size="17">Montants</text>
    <g font-size="19" text-anchor="middle">
      <text x="184" y="100">1</text>
      <text x="284" y="100">2</text>
      <text x="384" y="100">3</text>
      <text x="484" y="100">4</text>
    </g>
    <text x="29" y="151" font-size="18" font-weight="bold">Rangée 1</text>
    <text x="29" y="215" font-size="18" font-weight="bold">Rangée 2</text>
  </g>
  <rect x="138" y="128" width="414" height="32" rx="8" fill="#a44620"/>
  <rect x="138" y="192" width="414" height="32" rx="8" fill="#1a6076"/>
  <g fill="#f4dfb4" stroke="#84623b" stroke-width="2">
    <rect x="160" y="106" width="48" height="140" rx="5"/>
    <rect x="260" y="106" width="48" height="140" rx="5"/>
    <rect x="360" y="106" width="48" height="140" rx="5"/>
    <rect x="460" y="106" width="48" height="140" rx="5"/>
  </g>
  <path d="M159 128h50v32h-50zm200 0h50v32h-50z" fill="#a44620"/>
  <path d="M259 192h50v32h-50zm200 0h50v32h-50z" fill="#1a6076"/>
</svg>
