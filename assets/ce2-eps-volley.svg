<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" role="img" aria-labelledby="title desc">
  <title id="title">Trois touches au volleyball</title>
  <desc id="desc">A oriente sa réception vers B. B prépare vers C. C renvoie au-dessus du filet.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#175f81"/></marker>
    <pattern id="net" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 0H9V9" stroke="#7a96a6" fill="none"/></pattern>
  </defs>
  <rect width="620" height="260" rx="16" fill="#f1f8fc"/>
  <g font-family="system-ui, sans-serif" fill="#193247">
    <text x="24" y="36" font-size="25" font-weight="700">Trois touches au volleyball</text>
    <rect x="24" y="55" width="572" height="143" rx="12" fill="#fff" stroke="#9db9ca" stroke-width="2"/>
    <rect x="485" y="105" width="22" height="81" fill="url(#net)" stroke="#3b5669" stroke-width="2"/>
    <g stroke="#175f81" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M98 143Q148 93 196 134"/><path d="M248 142Q295 94 346 135"/><path d="M400 144Q474 64 558 122"/>
    </g>
    <g fill="#175f81">
      <circle cx="78" cy="154" r="20"/><circle cx="226" cy="154" r="20"/><circle cx="378" cy="154" r="20"/>
    </g>
    <g fill="white" font-size="18" font-weight="700" text-anchor="middle">
      <text x="78" y="161">A</text><text x="226" y="161">B</text><text x="378" y="161">C</text>
    </g>
    <g font-size="15" font-weight="650">
      <text x="101" y="100">1 · Réception</text>
      <text x="248" y="100">2 · Passe</text>
      <text x="415" y="87">3 · Renvoi</text>
      <text x="522" y="176">Autre côté</text>
    </g>
    <text x="24" y="228" font-size="18">Dans cet exemple, la troisième touche renvoie le ballon.</text>
  </g>
</svg>
