<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 433" role="img" aria-labelledby="title desc">
  <title id="title">Les huit planètes dans l’ordre</title>
  <desc id="desc">À partir du Soleil, Mercure, Vénus, Terre, Mars, Jupiter, Saturne, Uranus et Neptune. Les rangs sont indiqués. Tailles et distances simplifiées.</desc>
  <rect width="640" height="433" rx="20" fill="#f0f9ff"/>
  <g font-family="system-ui, sans-serif" fill="#112a3d">
    <text x="26" y="41" font-size="28" font-weight="700">Les huit planètes dans l’ordre</text>
    <text x="26" y="72" font-size="21">Le rang 1 est le plus proche du Soleil.</text>
    <rect x="16" y="93" width="608" height="147" rx="15" fill="#fff" stroke="#a7c8d4"/>
    <rect x="16" y="253" width="608" height="147" rx="15" fill="#fff" stroke="#a7c8d4"/>
    <text x="32" y="121" font-size="21" font-weight="700">Planètes rocheuses</text>
    <text x="32" y="281" font-size="21" font-weight="700">Planètes géantes</text>
    <g stroke="#335469" stroke-width="2">
      <circle cx="93" cy="169" r="16" fill="#a8a8ad"/>
      <circle cx="245" cy="169" r="23" fill="#ebc584"/>
      <circle cx="397" cy="169" r="24" fill="#1f7ac4"/>
      <path d="M382 156q10-9 16-6l5 8-8 6 5 8-7 13-5-13-8-5z" fill="#72c584" stroke="none"/>
      <circle cx="549" cy="169" r="19" fill="#c76543"/>
      <circle cx="93" cy="332" r="32" fill="#dcac81"/>
      <path d="M65 318q28 8 56 0m-60 13q32 8 64 0m-61 15q29 5 58-1" fill="none" stroke="#9c502d" stroke-width="4"/>
      <ellipse cx="245" cy="332" rx="43" ry="10" transform="rotate(-18 245 332)" fill="#eac99c" stroke="#946426"/>
      <circle cx="245" cy="332" r="25" fill="#e7bb71"/>
      <path d="M205 344q37 3 79-22" fill="none" stroke="#946426" stroke-width="3"/>
      <circle cx="397" cy="332" r="24" fill="#78c6c8"/>
      <circle cx="549" cy="332" r="24" fill="#4074c7"/>
    </g>
    <g text-anchor="middle" font-size="22" font-weight="700">
      <text x="93" y="218">1 Mercure</text>
      <text x="245" y="218">2 Vénus</text>
      <text x="397" y="218">3 Terre</text>
      <text x="549" y="218">4 Mars</text>
      <text x="93" y="384">5 Jupiter</text>
      <text x="245" y="384">6 Saturne</text>
      <text x="397" y="384">7 Uranus</text>
      <text x="549" y="384">8 Neptune</text>
    </g>
    <text x="26" y="423" font-size="17" fill="#335469">Tailles et distances simplifiées.</text>
  </g>
</svg>
