<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 367" role="img" aria-labelledby="title desc">
  <title id="title">Lire la balance et le thermomètre</title>
  <desc id="desc">La balance indique 350 grammes. Le thermomètre est gradué de 20 à 30 degrés Celsius de deux en deux. Le niveau atteint la deuxième graduation après 20.</desc>
