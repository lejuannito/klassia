name: Klassia quality
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run catalog && npm run validate && npm test && npm run build
      - run: git diff --exit-code -- precache-manifest.js data/catalog.json data/coverage.json docs/couverture.csv docs/metrics.json
      # The test browser comes from the Playwright download only, without apt-get:
      # the Ubuntu package mirrors are sometimes unreachable from the runners, and the
      # runner image already provides the system libraries Chromium needs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npx playwright install chromium
      - run: npm run test:reliability
      - run: node tests/candidate-browser.cjs
        if: ${{ !cancelled() }}
      - run: node tests/browser.cjs
        if: ${{ !cancelled() }}
      - run: node tests/pwa-browser.cjs
        if: ${{ !cancelled() }}
      - run: npm run test:gs
        if: ${{ !cancelled() }}
      - run: npm run test:speech
        if: ${{ !cancelled() }}
      - run: npm run test:search
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: candidate-browser-previews
          path: test-results/
          if-no-files-found: ignore
