name: Klassia quality
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run catalog && npm run validate && npm test && npm run build
      - run: git diff --exit-code -- precache-manifest.js data/catalog.json data/coverage.json docs/couverture.csv docs/metrics.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:gs && npm run test:speech
