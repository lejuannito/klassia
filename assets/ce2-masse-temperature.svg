    <circle cx="412" cy="294" r="16" fill="#b91c1c"/>
    <path d="M430 142h20m-20 24h20m-20 24h20m-20 24h20m-20 24h20m-20 24h20" fill="none" stroke="#335469" stroke-width="2.5"/>
    <path d="M417 214h12" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="3 2"/>
    <g font-size="20">
