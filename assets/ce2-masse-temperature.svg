      <text x="445" y="100">Thermomètre</text>
    </g>
    <path d="M102 204q3-37 24-51l-7-17h72l-7 17q21 14 24 51z" fill="#fef3c7" stroke="#80520a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M83 208h144v14H83zM80 223h150l23 83H57Z" fill="#dbe7ec" stroke="#335469" stroke-width="3" stroke-linejoin="round"/>
    <rect x="102" y="247" width="106" height="42" rx="7" fill="#fff" stroke="#335469" stroke-width="2"/>
